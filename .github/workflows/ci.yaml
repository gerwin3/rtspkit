name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: build / ${{ matrix.os }} / zig ${{ matrix.zig-version }}
    strategy:
      fail-fast: false
      matrix:
        zig-version: ["0.16.0"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Build (Debug)
        run: zig build --summary all

      - name: Build (Release Safe)
        run: zig build --release=safe --summary all

  test:
    name: test / ${{ matrix.os }} / zig ${{ matrix.zig-version }}
    strategy:
      fail-fast: false
      matrix:
        zig-version: ["0.16.0"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Test
        run: zig build test --summary all
